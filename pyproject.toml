[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmamba-airnow-tempo"
version = "0.1.0"
description = "Unified TEMPO/AirNow graph Mamba predictor for hourly NO2 regression."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.scripts]
graphmamba-build-graph = "graphmamba.graph:main"
graphmamba-train = "graphmamba.train:main"

[tool.setuptools.packages.find]
where = ["src"]
